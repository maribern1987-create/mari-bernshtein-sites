    body { margin: 0; background: #faf4ee; color: #452e40; font: 1rem/1.55 system-ui, sans-serif; }

    h1 { font: 500 clamp(2.25rem, 7vw, 4.5rem)/1.06 Georgia, serif; margin: 0 0 2rem; }
    nav { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: .75rem; }
    a { display: block; padding: .85rem 1.2rem; border: 1px solid #bba9b1; border-radius: .4rem; color: inherit; text-underline-offset: .2em; background: #fffaf6; }
    a:first-child { background: #56374e; color: white; }
    a:hover { border-color: #593448; }
    a:focus-visible { outline: 3px solid #734760; outline-offset: 3px; }
  </style>
